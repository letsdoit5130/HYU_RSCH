name: 4x Daily Abalone Partner Sourcing Pipeline (KST 06:00, 12:00, 18:00, 00:00)

on:
  # schedule 비활성화 (2026-07-31, 사용자 요청) — 자동 4x 실행 중단, 수동 실행(workflow_dispatch)만 유지.
  # 재활성화하려면 아래 주석을 해제.
  # schedule:
  #   - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: {}

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  abalone-sourcing-4x-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 자동 커밋/푸시를 위해 detached HEAD가 아닌 실제 브랜치로 체크아웃
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system pandas openpyxl tabulate

      - name: Run Partner Sourcing Generator (Abalone)
        run: |
          python .agents/skills/trade-gen2.1-un-sourcing/scripts/generate_partner_sourcing.py \
            --item "Abalone" \
            --output_dir BIZ-Jeonbok \
            --item_slug abalone \
            --eda_report BIZ-Jeonbok/reports/BIZ-전복_Gathered_EDA_Report.md

      - name: Auto Commit and Push Updated Abalone Leads
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          TARGET_FILES="BIZ-Jeonbok/reports/Abalone_Buyers_Lead_List.md BIZ-Jeonbok/data/abalone_buyers_leads.xlsx BIZ-Jeonbok/data/abalone_sourcing_history.csv"

          # 커밋 대상 변경이 없으면 조용히 종료 (실행 실패로 취급하지 않음)
          if [ -z "$(git status --porcelain -- $TARGET_FILES)" ]; then
            echo "변경 사항 없음 — 커밋 생략"
            exit 0
          fi

          git add $TARGET_FILES
          git commit -m "Automated 4x Daily Abalone Sourcing Candidate Update [skip ci]" || { echo "커밋할 변경 사항 없음"; exit 0; }

          # 동시 실행/원격 변경으로 인한 non-fast-forward를 대비해 재시도
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공 (시도 $attempt)"
              exit 0
            fi
            echo "푸시 실패 (시도 $attempt), 원격 변경사항 반영 후 재시도..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "리베이스 실패"; exit 1; }
          done

          echo "3회 재시도 후에도 푸시 실패 — 브랜치 보호 규칙 또는 토큰 권한을 확인하세요."
          exit 1
